# Builds the Windows 11 app on GitHub's Windows runners, so it can be built without a
# Windows PC: the core with vcpkg + CMake, its tests, then the WinUI 3 app. The zipped app is
# attached to the run as an artifact.
name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # vcpkg's binary cache, so OpenCascade (about an hour) is built only once. Saved even
      # when a later step fails.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build core and app
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$PWD\vcpkg-cache"
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          .\app-windows\build.ps1 -Arch ${{ matrix.arch }} -SkipTests:$('${{ matrix.arch }}' -eq 'ARM64')

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}

      # The x64 runner can start the x64 app: check it opens a window and keeps running.
      - name: Check the app starts
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $p = Start-Process build-windows\app\StawnCADPro.exe -PassThru
          Start-Sleep -Seconds 20
          $log = "$env:LOCALAPPDATA\STAWN CAD Pro\crash.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.HasExited) { throw "StawnCADPro.exe exited during startup with code $($p.ExitCode)" }
          Stop-Process $p
          Write-Host "StawnCADPro.exe was still running after 20 s"

      # Screenshots of the sample part and of sketch mode, printed into the log as base64 so
      # the look can be checked without downloading anything, and uploaded as an artifact.
      - name: Screenshots
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force screenshots | Out-Null
          foreach ($demo in "part", "sketch") {
            $p = Start-Process build-windows\app\StawnCADPro.exe -ArgumentList "--demo", $demo -PassThru
            Start-Sleep -Seconds 25
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $file = "screenshots\$demo.png"
            $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            if (-not $p.HasExited) { Stop-Process $p }
            Write-Host "SCREENSHOT-BEGIN $demo $($screen.Width)x$($screen.Height)"
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($file))
            for ($i = 0; $i -lt $b64.Length; $i += 8000) { Write-Host $b64.Substring($i, [Math]::Min(8000, $b64.Length - $i)) }
            Write-Host "SCREENSHOT-END $demo"
          }

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: screenshots
          path: screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: StawnCADPro-windows-${{ matrix.arch }}
          path: build-windows/app
