# Builds the Windows 11 app on GitHub's Windows runners, so it can be built without a
# Windows PC: the core with vcpkg + CMake, its tests, then the WinUI 3 app. The zipped app is
# attached to the run as an artifact.
name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    strategy:
      matrix:
        arch: [x64, ARM64]
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build core and app
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          .\app-windows\build.ps1 -Arch ${{ matrix.arch }} -SkipTests:$('${{ matrix.arch }}' -eq 'ARM64')

      - uses: actions/upload-artifact@v4
        with:
          name: StawnCADPro-windows-${{ matrix.arch }}
          path: build-windows/app
