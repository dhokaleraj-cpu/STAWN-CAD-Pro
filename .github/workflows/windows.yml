# Builds the Windows 11 app on GitHub's Windows runners, so it can be built without a
# Windows PC: the core with vcpkg + CMake, its tests, then the WinUI 3 app. The zipped app is
# attached to the run as an artifact.
name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # vcpkg's binary cache, so OpenCascade (about an hour) is built only once. Saved even
      # when a later step fails.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build core and app
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$PWD\vcpkg-cache"
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          .\app-windows\build.ps1 -Arch ${{ matrix.arch }} -SkipTests:$('${{ matrix.arch }}' -eq 'ARM64')

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}

      # The x64 runner can start the x64 app: check it opens a window and keeps running.
      - name: Check the app starts
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $p = Start-Process build-windows\app\StawnCADPro.exe -PassThru
          Start-Sleep -Seconds 20
          $log = "$env:LOCALAPPDATA\STAWN CAD Pro\crash.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.HasExited) { throw "StawnCADPro.exe exited during startup with code $($p.ExitCode)" }
          Stop-Process $p
          Write-Host "StawnCADPro.exe was still running after 20 s"

      - uses: actions/upload-artifact@v4
        with:
          name: StawnCADPro-windows-${{ matrix.arch }}
          path: build-windows/app
