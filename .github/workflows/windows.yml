# Builds the Windows 11 app on GitHub's Windows runners, so it can be built without a
# Windows PC: the core with vcpkg + CMake, its tests, then the WinUI 3 app. The zipped app is
# attached to the run as an artifact.
name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # the screenshots branch

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # vcpkg's binary cache, so OpenCascade (about an hour) is built only once. Saved even
      # when a later step fails.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build core and app
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$PWD\vcpkg-cache"
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          .\app-windows\build.ps1 -Arch ${{ matrix.arch }} -SkipTests:$('${{ matrix.arch }}' -eq 'ARM64')

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}

      # The x64 runner can start the x64 app: check it opens a window and keeps running.
      - name: Check the app starts
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          # A startup error shows a message box (which keeps the process alive) and writes
          # crash.log, so check for the log as well as for an exit.
          $log = "$env:LOCALAPPDATA\STAWN CAD Pro\crash.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          foreach ($demo in "", "sketch") {
            $p = if ($demo) { Start-Process build-windows\app\StawnCADPro.exe -ArgumentList "--demo", $demo -PassThru }
                 else { Start-Process build-windows\app\StawnCADPro.exe -PassThru }
            Start-Sleep -Seconds 20
            $exited = $p.HasExited
            if (-not $exited) { Stop-Process $p }
            if (Test-Path $log) { Get-Content $log; throw "StawnCADPro.exe $demo failed during startup (crash.log above)" }
            if ($exited) { throw "StawnCADPro.exe $demo exited during startup with code $($p.ExitCode)" }
            Write-Host "StawnCADPro.exe $demo was still running after 20 s without errors"
          }

      # Screenshots of the sample part and of sketch mode, uploaded as an artifact and pushed to
      # the ci-screenshots branch (screenshots/<arch>/ of the latest main build), so the look can
      # be checked with a plain git fetch.
      - name: Screenshots
        if: always() && matrix.arch == 'x64' && hashFiles('build-windows/app/StawnCADPro.exe') != ''
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force screenshots | Out-Null
          foreach ($demo in "part", "sketch") {
            $p = Start-Process build-windows\app\StawnCADPro.exe -ArgumentList "--demo", $demo -PassThru
            Start-Sleep -Seconds 25
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $file = "screenshots\$demo.png"
            $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            if (-not $p.HasExited) { Stop-Process $p; $p.WaitForExit() }
          }
          $log = "$env:LOCALAPPDATA\STAWN CAD Pro\crash.log"
          if (Test-Path $log) { Get-Content $log }

      - name: Push screenshots to the ci-screenshots branch
        if: always() && matrix.arch == 'x64' && github.ref == 'refs/heads/main' && hashFiles('screenshots/*.png') != ''
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git worktree add --orphan -b ci-screenshots-tmp $env:RUNNER_TEMP\shots
          Copy-Item screenshots\*.png $env:RUNNER_TEMP\shots\
          Push-Location $env:RUNNER_TEMP\shots
          git add -A
          git commit -q -m "Screenshots of ${{ github.sha }}"
          git push -f origin HEAD:ci-screenshots
          Pop-Location

      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'x64' && hashFiles('build-windows/app/StawnCADPro.exe') != ''
        with:
          name: screenshots
          path: screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: StawnCADPro-windows-${{ matrix.arch }}
          path: build-windows/app
